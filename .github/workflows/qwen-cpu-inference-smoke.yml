name: Qwen real paired inference (CPU smoke, not benchmark)

# One-time opt-in via research branch push. No GPU billing or private key.
# Short deterministic generations are NOT the published MATH-500 protocol.
on:
  push:
    branches:
      - research/qwen-cpu-inference-v0.7
    paths:
      - '.github/workflows/qwen-cpu-inference-smoke.yml'
      - 'scripts/qwen_cpu_smoke.py'
      - 'scripts/qwen_fetch_pinned.py'
      - 'tests/test_qwen_cpu_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-cpu-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-cpu-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and HF inference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'safetensors>=0.4,<1' 'huggingface_hub>=1,<2' 'accelerate>=1' 'pillow>=10' 'transformers>=5'
      - name: Download exact public base and edited checkpoints
        run: python scripts/qwen_fetch_pinned.py --root '${{ runner.temp }}/qwen-cpu'
      - name: Run a real tiny greedy generation from original Qwen
        run: |
          python scripts/qwen_cpu_smoke.py run \
            --model-dir '${{ runner.temp }}/qwen-cpu/base' \
            --source-pins '${{ runner.temp }}/qwen-cpu/source-pins.json' \
            --model-tag base --max-new-tokens 32 --output runs/cpu-smoke/base.json
      - name: Run same generation from patched Qwen
        run: |
          python scripts/qwen_cpu_smoke.py run \
            --model-dir '${{ runner.temp }}/qwen-cpu/edited' \
            --source-pins '${{ runner.temp }}/qwen-cpu/source-pins.json' \
            --model-tag edited --max-new-tokens 32 --output runs/cpu-smoke/edited.json
      - name: Compare and label evidence accurately
        run: |
          python scripts/qwen_cpu_smoke.py compare \
            --base runs/cpu-smoke/base.json --edited runs/cpu-smoke/edited.json \
            --output runs/cpu-smoke/paired.json
      - name: Upload small unsigned evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-cpu-smoke-${{ github.run_id }}
          path: runs/cpu-smoke/*.json
          if-no-files-found: warn
          retention-days: 14
