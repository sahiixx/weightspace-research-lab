name: weight-space-lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and lab
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Complete deterministic smoke and audit
        run: bash scripts/run_all.sh runs/ci-audit
      - name: Upload reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weightspace-audit-${{ github.run_number }}
          path: |
            runs/ci-audit/**/*.json
            runs/ci-audit/**/*.md
            runs/ci-audit/*.json
            runs/ci-audit/*.md
          if-no-files-found: warn
          retention-days: 14
