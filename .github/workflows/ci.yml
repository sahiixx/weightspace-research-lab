name: weight-space-lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify source checksum manifest
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and lab
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m pip install -e packages/sahiixx_trust_core
      - name: Qwen reproduction preflight (no GPU or download)
        run: python scripts/qwen_reproduction.py preflight --out qwen-preflight.json
      - name: Complete deterministic smoke and audit
        run: bash scripts/run_all.sh runs/ci-audit
      - name: Upload reports for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weightspace-audit-${{ github.run_number }}
          path: |
            runs/ci-audit/**/*.json
            runs/ci-audit/**/*.md
            runs/ci-audit/*.json
            runs/ci-audit/*.md
          if-no-files-found: warn
          retention-days: 14
